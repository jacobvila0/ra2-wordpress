# Define un servidor virtual de nginx.
server {

    # Hace que nginx escuche peticiones HTTP en el puerto 80 del contenedor.
    listen 80;

    # Acepta peticiones independientemente del nombre de dominio utilizado.
    server_name _;

    # Define la carpeta donde se encuentran los archivos de WordPress.
    root /var/www/html;

    # Indica que index.php será el archivo principal por defecto.
    index index.php;

    # Permite peticiones de hasta 64 MB, útil para subir archivos a WordPress.
    client_max_body_size 64M;

    # Configuración para las peticiones normales.
    location / {

        # Busca primero el archivo o directorio solicitado.
        # Si no existe, envía la petición a index.php junto con sus parámetros.
        try_files $uri $uri/ /index.php?$args;
    }

    # Configuración específica para los archivos PHP.
    location ~ \.php$ {

        # Carga los parámetros estándar necesarios para FastCGI.
        include fastcgi_params;

        # Envía las peticiones PHP al servicio wordpress por el puerto 9000.
        fastcgi_pass wordpress:9000;

        # Indica a PHP-FPM la ruta completa del script PHP que debe ejecutar.
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
